name: Deploy Cloudflare Worker API

on:
  push:
    branches:
      - master
      - dev/*
    paths:
      - 'api/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/**'

jobs:
  pre-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Run API Tests
        run: yarn workspace api test

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Cloudflare Worker
        working-directory: api
        run: npx wrangler deploy --var SUPABASE_URL:"${{ secrets.SUPABASE_URL }}" --var SUPABASE_SECRET_KEY:"${{ secrets.SUPABASE_SECRET_KEY }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}